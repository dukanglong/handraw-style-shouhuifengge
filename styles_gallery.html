<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>277 种手绘风格图鉴 · Hand-drawn Style Catalog</title>
<style>
:root {
  --bg: #faf7f2;
  --card-bg: #ffffff;
  --text: #2d2d2d;
  --text-light: #6b6b6b;
  --border: #e8e4dd;
  --accent: #1E3A5F;
  --accent-warm: #D2691E;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* Header */
.header {
  background: linear-gradient(135deg, #1E3A5F 0%, #2E5AA1 100%);
  color: white;
  padding: 48px 24px 36px;
  text-align: center;
}
.header h1 {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.header p {
  font-size: 1rem;
  opacity: 0.85;
  max-width: 600px;
  margin: 0 auto;
}
.header .stats {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 24px;
  font-size: 0.9rem;
  opacity: 0.9;
}
.header .stat-num {
  font-size: 1.6rem;
  font-weight: 700;
  display: block;
}

/* Controls */
.controls {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
.controls-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.search {
  flex: 1;
  min-width: 240px;
  position: relative;
}
.search input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 1rem;
  background: var(--bg);
  transition: all 0.2s;
}
.search input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
}
.search::before {
  content: "🔍";
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
}

.filter-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  padding: 8px 16px;
  border: 2px solid var(--border);
  background: white;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
  user-select: none;
}
.chip:hover {
  border-color: var(--accent);
}
.chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.chip.color-chip {
  padding: 6px 14px 6px 34px;
  position: relative;
}
.chip.color-chip::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.1);
}

.sort-select {
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 0.85rem;
  background: var(--bg);
  cursor: pointer;
}

/* Layout */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 24px;
}

.section-header {
  margin: 36px 0 16px;
  padding: 12px 16px;
  background: white;
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  box-shadow: var(--shadow);
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
}
.card-img {
  aspect-ratio: 1;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s;
}
.card:hover .card-img img {
  transform: scale(1.05);
}
.card-body {
  padding: 12px 14px 14px;
}
.card-num {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: 0.5px;
  margin-bottom: 2px;
  font-family: "SF Mono", Menlo, monospace;
}
.card-name {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 8px;
}
.card-traits {
  font-size: 0.75rem;
  color: var(--text-light);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-color {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 0.72rem;
  color: var(--text-light);
}
.card-color-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  flex-shrink: 0;
}
.card-section-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.65);
  color: white;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
}

/* Empty */
.empty {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-light);
}
.empty h3 {
  font-size: 1.4rem;
  margin-bottom: 8px;
  color: var(--text);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.active {
  display: flex;
}
.modal {
  background: white;
  border-radius: 16px;
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  font-size: 1.2rem;
  cursor: pointer;
  z-index: 10;
  transition: background 0.2s;
}
.modal-close:hover { background: var(--border); }
.modal-hero {
  padding: 32px 32px 0;
}
.modal-hero-img {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  background: var(--bg);
  border-radius: 12px;
}
.modal-content {
  padding: 24px 32px 32px;
}
.modal-num {
  font-family: "SF Mono", Menlo, monospace;
  font-size: 0.85rem;
  color: var(--text-light);
  letter-spacing: 1px;
}
.modal-title {
  font-size: 1.6rem;
  font-weight: 700;
  margin: 4px 0 4px;
}
.modal-ref {
  font-size: 0.9rem;
  color: var(--text-light);
  margin-bottom: 20px;
}
.modal-section {
  margin-bottom: 20px;
}
.modal-section h4 {
  font-size: 0.85rem;
  color: var(--accent);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.modal-traits {
  font-size: 0.92rem;
  line-height: 1.8;
  color: var(--text);
  background: var(--bg);
  padding: 16px;
  border-radius: 10px;
}
.modal-color-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: 10px;
}
.modal-color-swatch {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 2px solid rgba(0,0,0,0.1);
  flex-shrink: 0;
}
.modal-color-info { flex: 1; }
.modal-color-name {
  font-weight: 600;
  font-size: 0.95rem;
}
.modal-color-hex {
  font-size: 0.8rem;
  color: var(--text-light);
  font-family: "SF Mono", Menlo, monospace;
}

.prompt-box {
  background: var(--bg);
  border-radius: 10px;
  padding: 16px;
  position: relative;
  margin-bottom: 12px;
}
.prompt-box textarea {
  width: 100%;
  min-height: 100px;
  border: none;
  background: transparent;
  font-size: 0.88rem;
  line-height: 1.7;
  resize: vertical;
  font-family: inherit;
  color: var(--text);
}
.prompt-box textarea:focus { outline: none; }
.prompt-copy {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.15s;
}
.prompt-copy:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.prompt-label {
  font-size: 0.78rem;
  color: var(--text-light);
  margin-bottom: 6px;
  display: block;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 24px;
  color: var(--text-light);
  font-size: 0.85rem;
  border-top: 1px solid var(--border);
  margin-top: 48px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--accent);
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 0.88rem;
  z-index: 300;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@media (max-width: 600px) {
  .header h1 { font-size: 1.5rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .controls-inner { flex-direction: column; align-items: stretch; }
  .modal-hero, .modal-content { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>

};
COLORS.forEach(c => c.hex = c.hex || hexMap[c.id] || "#CCCCCC");
STYLES.forEach(s => s.rec_color_hex = s.rec_color_hex || hexMap[s.rec_color] || "#CCCCCC");

const state = {
  search: "",
  section: "all",
  color: "all",
  sort: "num"
};

// Build color chips
const colorChipsContainer = document.getElementById("colorChips");
COLORS.forEach(c => {
  const chip = document.createElement("span");
  chip.className = "chip color-chip";
  chip.style.setProperty("--chip-color", c.hex);
  chip.dataset.color = c.id;
  chip.innerHTML = c.name_zh;
  // insert style for dot
  const style = document.createElement("style");
  style.textContent = `[data-color="${c.id}"].color-chip::before { background: ${c.hex}; }`;
  document.head.appendChild(style);
  chip.addEventListener("click", () => {
    document.querySelectorAll("#colorChips .chip").forEach(x => x.classList.remove("active"));
    chip.classList.add("active");
    state.color = c.id;
    render();
  });
  colorChipsContainer.appendChild(chip);
});

// Event listeners
document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value.toLowerCase();
  render();
});
document.getElementById("sortSelect").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});
document.querySelectorAll("#sectionChips .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll("#sectionChips .chip").forEach(x => x.classList.remove("active"));
    chip.classList.add("active");
    state.section = chip.dataset.section;
    render();
  });
});
// "all" color chip handler
const allColorChip = colorChipsContainer.querySelector('[data-color="all"]');
allColorChip.addEventListener("click", () => {
  document.querySelectorAll("#colorChips .chip").forEach(x => x.classList.remove("active"));
  allColorChip.classList.add("active");
  state.color = "all";
  render();
});

function filterStyles() {
  let result = [...STYLES];
  
  if (state.search) {
    const q = state.search;
    result = result.filter(s => {
      const hay = (s.num + " " + s.ref + " " + s.gen_name + " " + s.traits).toLowerCase();
      return hay.includes(q);
    });
  }
  if (state.section !== "all") {
    result = result.filter(s => s.section === state.section);
  }
  if (state.color !== "all") {
    result = result.filter(s => s.rec_color === state.color);
  }
  
  // Sort
  if (state.sort === "num") {
    result.sort((a, b) => a.num - b.num);
  } else if (state.sort === "name") {
    result.sort((a, b) => a.gen_name.localeCompare(b.gen_name, 'en'));
  } else if (state.sort === "section") {
    result.sort((a, b) => a.section.localeCompare(b.section) || a.num - b.num);
  }
  
  return result;
}

function getImgPath(s) {
  return s.grid_img && s.grid_img !== "" ? s.grid_img : s.img;
}

function render() {
  const filtered = filterStyles();
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const countEl = document.getElementById("resultsCount");
  
  countEl.textContent = `共 ${filtered.length} 种风格`;
  
  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  
  // Group by section if sort is section or default
  let html = "";
  let currentSection = "";
  
  filtered.forEach(s => {
    if (state.sort === "section" || state.sort === "num") {
      if (s.section !== currentSection) {
        currentSection = s.section;
        html += `<div class="section-header">${SECTIONS[s.section] || s.section}</div>`;
      }
    }
    
    const numStr = String(s.num).padStart(3, "0");
    html += `
      <div class="card" onclick="openModal(${s.num})">
        <div class="card-section-badge">${s.section}</div>
        <div class="card-img">
          <img src="${getImgPath(s)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2214%22>${numStr}</text></svg>'">
        </div>
        <div class="card-body">
          <div class="card-num">#${numStr}</div>
          <div class="card-name">${s.gen_name}</div>
          <div class="card-traits">${s.traits || "—"}</div>
          <div class="card-color">
            <div class="card-color-dot" style="background:${s.rec_color_hex}"></div>
            <span>${s.rec_color} · ${s.rec_color_name_zh}</span>
          </div>
        </div>
      </div>
    `;
  });
  
  grid.innerHTML = html;
}

function openModal(num) {
  const s = STYLES.find(x => x.num === num);
  if (!s) return;
  
  document.getElementById("modalImg").src = getImgPath(s);
  
  const zhPrompt = buildZhPrompt(s);
  const enPrompt = buildEnPrompt(s);
  
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-num">风格编号 #${String(s.num).padStart(3, "0")}</div>
    <h2 class="modal-title">${s.gen_name}</h2>

    <div class="modal-section">
      <h4>🎨 核心视觉特征</h4>
      <div class="modal-traits">${s.traits || "（无额外描述）"}</div>

    <div class="modal-section">
      <h4>🌈 推荐主题色</h4>
      <div class="modal-color-row">

        <div class="modal-color-info">
          <div class="modal-color-name">${s.rec_color} · ${s.rec_color_name_zh} / ${s.rec_color_name_en}</div>
          <div class="modal-color-hex">HEX: ${s.rec_color_hex}</div>
        </div>
      </div>
    </div>
    
    <div class="modal-section">
      <h4>📝 生成提示词（中文）</h4>

    <div class="modal-section">
      <h4>📝 生成提示词（English）</h4>
      <div class="prompt-box">
        <span class="prompt-label">English prompt — paste into any image AI</span>
        <textarea id="enPrompt">${enPrompt}</textarea>
        <button class="prompt-copy" onclick="copyPrompt('enPrompt')">Copy</button>
      </div>

      💡 使用方法：打开 Midjourney / DALL-E / GPT Image / Stable Diffusion / Flux，把上面的提示词贴进去，把 [主题/Theme] 替换成你想画的内容即可。
    </div>
  `;
  
  document.getElementById("modal").classList.add("active");
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
}

document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

function copyPrompt(id) {
  const el = document.getElementById(id);
  el.select();
  document.execCommand("copy");
  showToast("已复制到剪贴板 ✓");
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
}

function buildZhPrompt(s) {
  const numStr = String(s.num).padStart(3, "0");
  let colorLine = `主题色：${s.rec_color_name_zh}（${s.rec_color_name_en}）。`;
  let traitsLine = "";
  if (s.traits && s.traits.length > 0) {
    // filter negative clauses
    const filtered = s.traits.split(/[；;]/).filter(t => !/避免|不要|不准|禁止/.test(t)).join("；");
    traitsLine = `核心风格特征：${filtered}。`;
  }
  return `风格名称：#${numStr} · ${s.gen_name}。参考作者/风格名称：${s.ref}。${colorLine}${traitsLine}主题：[在这里写你的主题，如：秋天的第一杯奶茶]`;
}

function buildEnPrompt(s) {
  const numStr = String(s.num).padStart(3, "0");
  let colorLine = `Theme color: ${s.rec_color_name_en} (${s.rec_color_name_zh}).`;
  let traitsLine = "";
  if (s.traits && s.traits.length > 0) {
    const filtered = s.traits.split(/[；;]/).filter(t => !/避免|不要|不准|禁止/.test(t)).join("; ");
    traitsLine = `Core style traits: ${filtered}.`;
  }
  return `Style name: #${numStr} · ${s.gen_name}. Reference author/style name: ${s.ref}. ${colorLine} ${traitsLine} Theme: [Write your theme here, e.g., autumn's first milk tea]`;
}

// Init
render();
</script>
